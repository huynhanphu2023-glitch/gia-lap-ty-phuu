<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cà Mau Empire - Comprehensive Simulator</title>
    <style>
        :root { --bg: #020617; --card: #0f172a; --text: #f1f5f9; --accent: #38bdf8; --border: #1e293b; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 20px; }
        .grid { display: grid; grid-template-columns: 300px 1fr 300px; gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; }
        h2 { font-size: 1.1rem; color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .btn { background: var(--accent); color: black; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 8px; font-weight: bold; }
        .log-box { height: 450px; overflow-y: auto; font-size: 0.8rem; color: #94a3b8; }
        .stat-val { color: #10b981; font-weight: bold; }
    </style>
</head>
<body>
    <div class="grid">
        <div class="card">
            <h2>TÀI CHÍNH CỐT LÕI</h2>
            <div id="finance"></div>
            <button class="btn" onclick="buyAsset('land')">MUA ĐẤT (20M)</button>
            <button class="btn" onclick="buyAsset('factory')">XÂY XƯỞNG (50M)</button>
            <button class="btn" style="background:#f59e0b" onclick="loanAction()">VAY NGÂN HÀNG (10M)</button>
        </div>
        <div class="card">
            <h2>BẢN ĐỒ CHIẾN LƯỢC CÀ MAU</h2>
            <div id="map"></div>
        </div>
        <div class="card">
            <h2>NHẬT KÝ VĨ MÔ</h2>
            <div id="log" class="log-box"></div>
        </div>
    </div>

<script>
    // --- LÕI DỮ LIỆU ĐỒ SỘ (Phần ghép nối) ---
    const game = {
        money: 100000000,
        reputation: 50,
        loanDebt: 0,
        assets: { lands: 0, factories: 0 },
        regions: {
            "P1": { name: "Phường 1", yield: 1.5 },
            "P5": { name: "Phường 5", yield: 1.8 },
            "TanThanh": { name: "Tân Thành", yield: 1.2 }
        }
    };

    function updateUI() {
        document.getElementById('finance').innerHTML = `
            <p>Tiền mặt: <span class="stat-val">${game.money.toLocaleString()} VNĐ</span></p>
            <p>Uy tín: <span class="stat-val">${game.reputation} ⭐</span></p>
            <p>Nợ vay: <span class="stat-val">${game.loanDebt.toLocaleString()} VNĐ</span></p>
            <p>Tổng cơ sở: <span class="stat-val">${game.assets.factories}</span></p>
        `;
        let mapHtml = Object.keys(game.regions).map(k => `<p>📍 ${game.regions[k].name} (Hiệu suất: ${game.regions[k].yield}x)</p>`).join('');
        document.getElementById('map').innerHTML = mapHtml;
    }

    function log(msg) {
        const l = document.getElementById('log');
        l.innerHTML = `<div style="margin-bottom:5px;">➤ ${msg}</div>` + l.innerHTML;
    }

    function buyAsset(type) {
        if(type === 'land' && game.money >= 20000000) {
            game.money -= 20000000; game.assets.lands++;
            log("Mua thành công 1 lô đất tại Cà Mau.");
        } else if(type === 'factory' && game.money >= 50000000) {
            game.money -= 50000000; game.assets.factories++;
            log("Xây dựng xưởng sản xuất hoàn tất.");
        } else log("Không đủ vốn!");
        updateUI();
    }

    function loanAction() {
        game.money += 10000000;
        game.loanDebt += 12000000; // Lãi suất 20%
        log("Ngân hàng đã giải ngân 10 triệu. Nợ gốc + lãi = 12 triệu.");
        updateUI();
    }

    // --- VÒNG LẶP KINH TẾ (Game Loop) ---
    setInterval(() => {
        // Thu nhập
        let revenue = (game.assets.factories * 1500000) + (game.assets.lands * 500000);
        game.money += revenue;
        
        // Sự kiện Vĩ mô (Random 10%)
        if(Math.random() < 0.1) {
            let events = ["Sốt đất tại Tân Thành!", "Xưởng bị đình chỉ thuế!", "Được chính quyền hỗ trợ!"];
            log(`[SỰ KIỆN]: ${events[Math.floor(Math.random()*events.length)]}`);
            game.money += (Math.random() > 0.5 ? 5000000 : -5000000);
        }
        
        updateUI();
    }, 3000);

    updateUI();
    log("Hệ thống khởi chạy - Chế độ Vĩ mô đã kích hoạt.");
</script>
</body>
</html>
